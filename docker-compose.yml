services:
  rent_worker_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_worker_1
    command: python3 main.py rentTemporary
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      WORKER_NAME: rent_worker_1
      WORKER_COUNT: 2
      WORKER_INDEX: 0

      DIVAR_PROFILE_DIR: /app/profiles/phone1
      CHROMIUM_PATH: /usr/bin/chromium
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      CONTACT_BROWSER_HEADLESS: ${CONTACT_BROWSER_HEADLESS:-true}

      CONTACT_REQUEST_MIN_DELAY: 90
      CONTACT_REQUEST_MAX_EXTRA_DELAY: 60
      CONTACTS_BEFORE_LONG_COOLDOWN: 8
      CONTACT_LONG_COOLDOWN_MIN: 600
      CONTACT_LONG_COOLDOWN_MAX: 1200
      CONTACT_CAPTCHA_COOLDOWN_SECONDS: 7200
      CONTACT_CAPTCHA_RESOLVED_COOLDOWN_SECONDS: 60

      SMS_WEBHOOK_HOST: 0.0.0.0
      SMS_WEBHOOK_PORT: 5001
      SMS_CODE_TIMEOUT: 300
    volumes:
      - ./profiles/phone1:/app/profiles/phone1
      - ./logs:/app/logs
      - ./debug/phone1:/app/debug
    network_mode: host

  rent_worker_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rent_worker_2
    command: sh -c "sleep 180 && python3 main.py rentTemporary"
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    env_file:
      - .env
    environment:
      WORKER_NAME: rent_worker_2
      WORKER_COUNT: 2
      WORKER_INDEX: 1

      DIVAR_PROFILE_DIR: /app/profiles/phone2
      CHROMIUM_PATH: /usr/bin/chromium
      PLAYWRIGHT_HEADLESS: ${PLAYWRIGHT_HEADLESS:-true}
      CONTACT_BROWSER_HEADLESS: ${CONTACT_BROWSER_HEADLESS:-true}

      CONTACT_REQUEST_MIN_DELAY: 90
      CONTACT_REQUEST_MAX_EXTRA_DELAY: 60
      CONTACTS_BEFORE_LONG_COOLDOWN: 8
      CONTACT_LONG_COOLDOWN_MIN: 600
      CONTACT_LONG_COOLDOWN_MAX: 1200
      CONTACT_CAPTCHA_COOLDOWN_SECONDS: 7200
      CONTACT_CAPTCHA_RESOLVED_COOLDOWN_SECONDS: 60

      SMS_WEBHOOK_HOST: 0.0.0.0
      SMS_WEBHOOK_PORT: 5002
      SMS_CODE_TIMEOUT: 300
    volumes:
      - ./profiles/phone2:/app/profiles/phone2
      - ./logs:/app/logs
      - ./debug/phone2:/app/debug
    network_mode: host